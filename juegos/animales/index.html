<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Aprendemos - Animales</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="contenedor">

        <a href="../../index.html" class="volver">
            🏠 Menú principal
        </a>

        <h1>
            🐾 ¡Completa el animal! 🐾
        </h1>

        <p class="instruccion">
            Mira la imagen y presiona en el teclado
            la letra que falta.
        </p>


        <div class="imagen-container">

            <img
                id="imagenAnimal"
                src=""
                alt="Animal"
            >

        </div>


        <div
            id="palabra"
            class="palabra"
        ></div>


        <div class="ayuda">

            ⌨️ Presiona una letra del teclado

        </div>


        <div
            id="mensaje"
            class="mensaje"
        ></div>


        <div
            id="estrellas"
            class="estrellas"
        ></div>


        <div
            id="progreso"
            class="progreso"
        ></div>


        <button
            id="reiniciar"
            onclick="reiniciarJuego()"
        >
            🔄 Jugar otra vez
        </button>

    </main>


    <script src="script.js"></script>

</body>

</html>
