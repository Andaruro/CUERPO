<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Aprendemos - Partes del cuerpo</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="contenedor">

        <a
            href="../../index.html"
            class="volver"
        >
            🏠 Menú principal
        </a>


        <h1>
            🧒 ¡Completa la palabra! 🧒
        </h1>


        <p class="instruccion">

            Mira la imagen y completa
            la palabra.

        </p>


        <div class="imagen-container">

            <img
                id="imagenParte"
                src=""
                alt="Parte del cuerpo"
            >

        </div>


        <div
            id="palabra"
            class="palabra"
        ></div>


        <div class="ayuda">

            🔤 Elige la letra correcta

        </div>


        <div
            id="opciones"
            class="opciones"
        ></div>


        <div
            id="mensaje"
            class="mensaje"
        ></div>


        <div
            id="estrellas"
            class="estrellas"
        ></div>


        <div
            id="progreso"
            class="progreso"
        ></div>


        <button
            id="reiniciar"
            onclick="reiniciarJuego()"
        >

            🔄 Jugar otra vez

        </button>

    </main>


    <script src="script.js"></script>

</body>

</html>
