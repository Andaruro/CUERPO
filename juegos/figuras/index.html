<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Figuras geométricas</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="contenedor">


        <!-- BOTÓN VOLVER -->

        <a
            href="../../index.html"
            class="volver"
        >
            🏠 Menú principal
        </a>


        <!-- ENCABEZADO -->

        <h1>
            🔷 ¡Figuras geométricas! 🔷
        </h1>

        <p class="instruccion">
            Arrastra cada figura hasta su nombre.
        </p>


        <!-- PROGRESO -->

        <div
            id="progreso"
            class="progreso"
        >
            Ronda 1 de 10
        </div>


        <!-- ESTRELLAS -->

        <div
            id="estrellas"
            class="estrellas"
        >
        </div>


        <!-- =================================
             ZONA DEL JUEGO
             ================================= -->

        <div class="zona-juego">


            <!-- FIGURAS -->

            <div class="columna">

                <h2>
                    🔷 Figuras
                </h2>

                <div
                    id="figuras"
                    class="figuras"
                >
                </div>

            </div>


            <!-- NOMBRES -->

            <div class="columna">

                <h2>
                    📝 Nombres
                </h2>

                <div
                    id="nombres"
                    class="nombres"
                >
                </div>

            </div>


        </div>


        <!-- MENSAJE -->

        <div
            id="mensaje"
            class="mensaje"
        >
        </div>


        <!-- =================================
             MENÚ DE RESULTADO
             ================================= -->

        <div
            id="resultado"
            class="resultado"
        >

            <div
                id="resultadoTitulo"
                class="resultado-titulo"
            >
            </div>


            <div
                id="resultadoIntentos"
                class="resultado-intentos"
            >
            </div>


            <button
                id="siguiente"
                class="boton-siguiente"
            >
                Siguiente ➜
            </button>

        </div>


        <!-- REINICIAR -->

        <button
            id="reiniciar"
            class="reiniciar"
        >
            🔄 Jugar otra vez
        </button>


    </main>


    <script src="script.js"></script>

</body>

</html>
