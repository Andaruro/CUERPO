<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ordena las sílabas</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <main class="contenedor">


        <!-- =====================================
             VOLVER AL MENÚ
             ===================================== -->

        <a
            href="../../index.html"
            class="volver"
        >
            🏠 Menú principal
        </a>


        <!-- =====================================
             ENCABEZADO
             ===================================== -->

        <h1>
            🔤 ¡Ordena las sílabas! 🔤
        </h1>


        <p class="instruccion">
            Escribe las sílabas en el orden correcto.
        </p>


        <!-- =====================================
             PROGRESO
             ===================================== -->

        <div
            id="progreso"
            class="progreso"
        >
            Palabra 1 de 10
        </div>


        <!-- =====================================
             ESTRELLAS
             ===================================== -->

        <div
            id="estrellas"
            class="estrellas"
        >
        </div>


        <!-- =====================================
             IMAGEN / EMOJI
             ===================================== -->

        <img
            id="imagenPalabra"
            class="imagen-palabra"
            alt=""
        >


        <!-- =====================================
             PISTA
             ===================================== -->

        <div class="pista">

            Ordena:

        </div>


        <!-- =====================================
             SÍLABAS DESORDENADAS
             ===================================== -->

        <div
            id="silabasDesordenadas"
            class="silabas-desordenadas"
        >
        </div>


        <!-- =====================================
             ESPACIOS PARA RESPONDER
             ===================================== -->

        <div
            id="respuesta"
            class="respuesta"
        >
        </div>


        <!-- =====================================
             MENSAJE
             ===================================== -->

        <div
            id="mensaje"
            class="mensaje"
        >
        </div>


        <!-- =====================================
             INTENTOS
             ===================================== -->

        <div
            id="contadorIntentos"
            class="contador-intentos"
        >
            Intentos: 0
        </div>


        <!-- =====================================
             RESULTADO
             ===================================== -->

        <div
            id="resultado"
            class="resultado"
        >

            <div
                id="resultadoTitulo"
                class="resultado-titulo"
            >
            </div>


            <div
                id="resultadoIntentos"
                class="resultado-intentos"
            >
            </div>


            <button
                id="siguiente"
                class="boton-siguiente"
            >
                Siguiente ➜
            </button>

        </div>


        <!-- =====================================
             REINICIAR
             ===================================== -->

        <button
            id="reiniciar"
            class="reiniciar"
        >
            🔄 Jugar otra vez
        </button>


    </main>


    <script src="script.js"></script>

</body>

</html>
